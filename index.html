<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d17">
<title>これアウト？</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0d17;
    --ink: #f4f5fb;
    --ink-soft: #a9aec6;
    --card: rgba(20, 23, 40, 0.82);
    --card-line: rgba(255, 255, 255, 0.10);
    --out: #ff3355;      /* OUT */
    --safe: #2f8bff;     /* SAFE */
    --gold: #ffcc33;
    --radius: 20px;
    --font: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #flash {
    position: fixed; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(circle at 50% 40%, rgba(255, 40, 70, 0.55), rgba(255, 0, 40, 0.15) 70%);
  }
  #flash.on { animation: flash 0.6s ease-out; }
  @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }

  .screen {
    position: fixed; inset: 0;
    display: none; flex-direction: column;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto;
    overflow-y: auto;
  }
  .screen.active { display: flex; }

  button {
    font: inherit; color: inherit; border: 0; cursor: pointer;
    touch-action: manipulation;
  }
  button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

  /* タイトル */
  #screen-title { justify-content: flex-end; gap: 12px; }
  .logo { text-align: center; margin-bottom: auto; padding-top: 18vh; }
  .logo h1 {
    margin: 0; font-size: clamp(44px, 13vw, 72px); font-weight: 800; letter-spacing: 0.02em;
    text-shadow: 0 0 24px rgba(255, 51, 85, 0.55), 0 0 60px rgba(47, 139, 255, 0.35);
  }
  .logo p { margin: 6px 0 0; color: var(--ink-soft); font-size: 15px; }
  .level {
    display: flex; align-items: center; gap: 14px;
    width: 100%; padding: 16px 18px; border-radius: var(--radius);
    background: var(--card); border: 1px solid var(--card-line);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    text-align: left; transition: transform 0.15s ease;
  }
  .level:active { transform: scale(0.98); }
  .level .badge { font-size: 26px; width: 36px; text-align: center; }
  .level .name { font-weight: 800; font-size: 18px; }
  .level .sub { color: var(--ink-soft); font-size: 13px; margin-top: 2px; }
  .level .best { margin-left: auto; color: var(--gold); font-size: 13px; white-space: nowrap; }
  .fine { color: var(--ink-soft); font-size: 11.5px; line-height: 1.6; text-align: center; margin: 6px 0 0; }

  /* 問題 */
  #screen-quiz { justify-content: flex-end; }
  .hud {
    position: fixed; top: max(12px, env(safe-area-inset-top)); left: 0; right: 0;
    max-width: 560px; margin: 0 auto; padding: 0 16px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 14px; color: var(--ink-soft); pointer-events: none;
  }
  .hud .score { color: var(--gold); font-weight: 800; }
  .bar { position: fixed; top: max(40px, calc(env(safe-area-inset-top) + 28px)); left: 16px; right: 16px; max-width: 528px; margin: 0 auto; height: 4px; border-radius: 4px; background: rgba(255,255,255,0.1); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--out), var(--gold), var(--safe)); transition: width 0.4s ease; }

  .card {
    background: var(--card); border: 1px solid var(--card-line); border-radius: var(--radius);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    padding: 20px 18px;
  }
  .question { text-align: center; transition: opacity 0.25s ease, transform 0.25s ease; }
  .question.gone { opacity: 0; transform: translateY(20px); pointer-events: none; }
  .question .emoji { font-size: 44px; line-height: 1; }
  .question .text { font-size: clamp(18px, 5vw, 22px); font-weight: 800; line-height: 1.55; margin: 12px 0 4px; }
  .question .ask { color: var(--ink-soft); font-size: 14px; margin: 10px 0 16px; }
  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .answer {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 14px 8px 12px; border-radius: 18px; font-weight: 800;
    transition: transform 0.12s ease, filter 0.12s ease;
  }
  .answer:active { transform: scale(0.95); }
  .answer .word { font-size: clamp(30px, 9vw, 40px); line-height: 1.2; letter-spacing: 0.06em; padding: 6px 0; }
  .answer.out { background: linear-gradient(160deg, #ff4d6a, #c8102e); box-shadow: 0 8px 28px rgba(255, 51, 85, 0.35); }
  .answer.safe { background: linear-gradient(160deg, #4aa0ff, #1356c9); box-shadow: 0 8px 28px rgba(47, 139, 255, 0.35); }

  .explain {
    position: fixed; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto;
    padding: 0 16px max(16px, env(safe-area-inset-bottom));
    transform: translateY(110%); transition: transform 0.45s cubic-bezier(.2, .9, .25, 1.1);
  }
  .explain.show { transform: translateY(0); }
  .explain .card { max-height: 58vh; overflow-y: auto; }
  .verdict { font-size: 30px; font-weight: 800; margin: 0; }
  .verdict.ok { color: var(--gold); }
  .verdict.ng { color: #ff6b81; }
  .compare { display: flex; gap: 10px; margin: 10px 0 12px; font-size: 14px; flex-wrap: wrap; }
  .compare span { padding: 4px 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.08); }
  .compare b.out { color: var(--out); }
  .compare b.safe { color: var(--safe); }
  .law { display: inline-block; font-size: 13px; font-weight: 800; color: var(--gold); margin-bottom: 6px; }
  .explain p.body { margin: 0; line-height: 1.75; font-size: 15px; }
  .primary {
    width: 100%; margin-top: 16px; padding: 15px; border-radius: 16px;
    background: var(--ink); color: var(--bg); font-weight: 800; font-size: 17px;
  }
  .secondary {
    width: 100%; padding: 14px; border-radius: 16px;
    background: rgba(255, 255, 255, 0.08); border: 1px solid var(--card-line); font-weight: 800; font-size: 16px;
  }

  /* 結果 */
  #screen-result { gap: 12px; padding-top: max(24px, env(safe-area-inset-top)); }
  .final { text-align: center; }
  .final .points { font-size: 64px; font-weight: 800; line-height: 1.1; margin: 4px 0; }
  .final .points small { font-size: 24px; color: var(--ink-soft); }
  .final .rank { font-size: 22px; font-weight: 800; color: var(--gold); }
  .final .comment { color: var(--ink-soft); font-size: 14px; margin-top: 6px; line-height: 1.6; }
  .recap { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .recap li { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.5; }
  .recap .res { font-weight: 800; width: 22px; flex: none; }
  .recap .res.ok { color: var(--gold); }
  .recap .res.ng { color: #ff6b81; }
  .recap .ans { margin-left: auto; flex: none; font-weight: 800; }
  .recap .ans.out { color: var(--out); }
  .recap .ans.safe { color: var(--safe); }
  .notice { font-size: 12.5px; line-height: 1.7; color: var(--ink-soft); }
  .promo .label { font-size: 12px; color: var(--ink-soft); margin: 0 0 8px; }
  .promo a.app {
    display: flex; align-items: center; gap: 12px; color: inherit; text-decoration: none;
    padding: 12px; border-radius: 14px; background: rgba(255, 255, 255, 0.06); border: 1px solid var(--card-line);
  }
  .promo a.app:active { transform: scale(0.98); }
  .promo .app-emoji { font-size: 30px; width: 40px; text-align: center; flex: none; }
  .promo .app-name { font-weight: 800; font-size: 16px; }
  .promo .app-desc { color: var(--ink-soft); font-size: 13px; line-height: 1.5; margin-top: 2px; }
  .promo .app-go { margin-left: auto; color: var(--gold); font-weight: 800; flex: none; }
  .promo .more { display: flex; justify-content: space-between; margin-top: 10px; font-size: 13px; }
  .promo .more a, .promo .more button { color: var(--ink-soft); background: none; padding: 0; text-decoration: underline; }
  .notice strong { color: var(--ink); }

  @media (prefers-reduced-motion: reduce) {
    .explain, .question, .bar i { transition: none; }
    #flash.on { animation: none; }
  }
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="flash"></div>

<section id="screen-title" class="screen active" aria-label="タイトル">
  <div class="logo">
    <h1>これアウト？</h1>
    <p>やったら犯罪？ 常識ジャッジ</p>
  </div>
  <div id="levels" style="display:flex;flex-direction:column;gap:10px"></div>
  <p class="fine">一般的な法律知識を楽しむクイズです。実際にどうなるかは個別の事情で変わります。</p>
</section>

<section id="screen-quiz" class="screen" aria-label="問題">
  <div class="hud"><span id="hud-level"></span><span><span id="hud-count"></span>　<span class="score" id="hud-score"></span></span></div>
  <div class="bar"><i id="bar"></i></div>

  <div class="card question" id="question">
    <div class="emoji" id="q-emoji"></div>
    <div class="text" id="q-text"></div>
    <div class="ask">これ、アウト？</div>
    <div class="answers">
      <button class="answer out" data-answer="out" aria-label="アウト"><span class="word">OUT</span></button>
      <button class="answer safe" data-answer="safe" aria-label="セーフ"><span class="word">SAFE</span></button>
    </div>
  </div>

  <div class="explain" id="explain" aria-live="polite">
    <div class="card">
      <p class="verdict" id="verdict"></p>
      <div class="compare" id="compare"></div>
      <span class="law" id="law"></span>
      <p class="body" id="body"></p>
      <button class="primary" id="next">次へ</button>
    </div>
  </div>
</section>

<section id="screen-result" class="screen" aria-label="結果">
  <div class="card final">
    <div id="r-level" style="color:var(--ink-soft);font-size:14px"></div>
    <div class="points" id="r-points"></div>
    <div class="rank" id="r-rank"></div>
    <div class="comment" id="r-comment"></div>
  </div>
  <div class="card"><ul class="recap" id="recap"></ul></div>
  <div class="card promo" id="promo">
    <p class="label">ひと休みに、こんなアプリもどうぞ</p>
    <a class="app" id="promo-app" target="_blank" rel="noopener">
      <span class="app-emoji" id="promo-emoji"></span>
      <span><div class="app-name" id="promo-name"></div><div class="app-desc" id="promo-desc"></div></span>
      <span class="app-go">›</span>
    </a>
    <div class="more">
      <button id="promo-shuffle">べつのアプリ</button>
      <a href="https://hideto0926.github.io/" target="_blank" rel="noopener">アプリ一覧を見る</a>
    </div>
  </div>
  <div class="card notice">
    <strong>犯罪になることと、逮捕されることは別です。</strong>
    逮捕は、罪を犯したと疑う十分な理由があり、逃げたり証拠を隠したりするおそれがあるときなどに行われます。
    逮捕せずに捜査が進む「在宅事件」も多くあります。このクイズの答えは一般論で、実際には個別の事情で変わります。
    困ったときは弁護士などの専門家に相談してください。
  </div>
  <button class="primary" id="retry">もう一度</button>
  <button class="secondary" id="back">難易度を選ぶ</button>
</section>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
// ─────────────────────────────────────────────
// 問題データ
// answer: "out" = アウト（犯罪になりうる） / "safe" = セーフ（ふつうは犯罪にならない）
// ─────────────────────────────────────────────
const QUESTIONS = [
  // 常識レベル
  { level: "easy", emoji: "☂️", text: "他人の傘を自分のものと間違えて持って帰った。気づいて翌日すぐ返した。",
    answer: "safe", law: "窃盗罪（刑法235条）は成立しにくい",
    body: "窃盗罪は「わざと」他人の物を自分の物にすることが必要です。本当に間違えたのなら、ふつうは犯罪になりません。ただし、気づいたのに返さず使い続けると、遺失物等横領罪などが問題になることがあります。" },
  { level: "easy", emoji: "✉️", text: "同居している家族あての封筒が気になって、勝手に開けて中の手紙を読んだ。",
    answer: "out", law: "信書開封罪（刑法133条）",
    body: "正当な理由なく、封をしてある他人あての手紙を開けると犯罪です（1年以下の拘禁刑または20万円以下の罰金）。家族あてでも成立しえます。被害を受けた人が告訴しないと起訴できない「親告罪」です。" },
  { level: "easy", emoji: "🚃", text: "電車で寝過ごして終点まで行ってしまった。降りた駅で乗り越し精算をした。",
    answer: "safe", law: "精算すれば問題なし",
    body: "寝過ごして乗り越しても、差額をきちんと払えば問題ありません。ただし、精算せずに改札をすり抜けるなど、わざと運賃を払わない行為は詐欺罪や鉄道営業法違反に問われることがあります。" },
  { level: "easy", emoji: "🍙", text: "コンビニでお腹が空きすぎて、レジに行く前におにぎりを食べ始めた。そのあとレジでちゃんと払った。",
    answer: "safe", law: "払うつもりで、実際に払えば犯罪になりにくい",
    body: "払うつもりがあり、実際に払ったなら、ふつうは犯罪になりません。ただしマナー違反ですし、店の人に疑われても仕方がない行動です。払わずに店を出れば窃盗罪になります。会計は先に。" },
  { level: "easy", emoji: "🚲", text: "駅前に鍵のかかっていない自転車があったので、無断で乗って帰り、家の近くに乗り捨てた。",
    answer: "out", law: "窃盗罪（刑法235条）",
    body: "鍵がかかっていなくても、他人の自転車を無断で乗って行き乗り捨てると、返すつもりがないと見られて窃盗罪になりえます（10年以下の拘禁刑または50万円以下の罰金）。" },

  { level: "easy", emoji: "🍢", text: "スーパーの試食コーナーでウインナーを1つ食べ、何も買わずに帰った。",
    answer: "safe", law: "問題なし",
    body: "試食は、お店が無料で食べてもらうために出しているものです。買わなくても犯罪にはなりません。ただし、何個も食べたり持ち帰ったりするのはお店の想定をこえていて、トラブルのもとです。" },
  { level: "easy", emoji: "🧴", text: "ホテルに泊まったとき、部屋の使い捨て歯ブラシと小分けのシャンプーを持ち帰った。",
    answer: "safe", law: "ふつうは問題なし",
    body: "使い捨てのアメニティは、泊まった人が使うため（持ち帰ってもよいもの）として置かれているのが一般的です。一方、バスタオルやバスローブ、ドライヤーなど備品を持ち帰ると窃盗罪（刑法235条）になりえます。" },
  { level: "easy", emoji: "🌸", text: "公園の桜がきれいだったので、枝を1本折って家に持ち帰った。",
    answer: "out", law: "器物損壊罪（刑法261条）・窃盗罪など",
    body: "公園の木は管理している自治体などの物です。枝を折れば器物損壊罪（3年以下の拘禁刑または30万円以下の罰金もしくは科料）、持ち帰れば窃盗罪が問題になりえます。軽犯罪法や条例にも、公園の草木を傷つけることを禁じるものがあります。" },
  { level: "easy", emoji: "☎️", text: "いたずらで110番に電話し、「駅に爆弾を仕掛けた」とうそを言った。",
    answer: "out", law: "偽計業務妨害罪など（刑法233条）",
    body: "うその通報で警察や駅の仕事を妨害すると、偽計業務妨害罪などになりえます（3年以下の拘禁刑または50万円以下の罰金）。実際に逮捕される例がとても多い行為です。捜索にかかった費用の賠償を求められることもあります。" },
  { level: "easy", emoji: "📱", text: "自転車に乗りながら、スマホを手に持って地図アプリの画面を見続けた。",

    body: "自転車の「ながらスマホ」は、2024年11月から罰則が強化されました（6か月以下の拘禁刑または10万円以下の罰金）。2026年4月からは16歳以上の自転車の違反に反則金（青切符）の制度が始まり、ながらスマホは反則金の対象です。止まって見ましょう。" },
  { level: "easy", emoji: "🍻", text: "飲み会でビールを飲んだあと、自転車に乗って家に帰った。",

  { level: "easy", emoji: "🐚", text: "海水浴に行ったとき、砂浜で拾ったきれいな貝殻を持ち帰った。",

  { level: "easy", emoji: "🎁", text: "友達から誕生日にもらったプレゼントを、使わないのでフリマアプリで売った。",

  { level: "easy", emoji: "🤒", text: "本当は元気なのに「熱が出た」とうそをついて学校（会社）を休み、遊びに行った。",
    answer: "safe", law: "刑事上は犯罪にならない",
    body: "ずる休みそのものは犯罪ではありません。ただし会社なら、就業規則による処分の対象になることがあります。病気を理由にお金（給付金など）を受け取れば、詐欺罪が問題になりえます。" },
  { level: "easy", emoji: "💬", text: "SNSで、芸能人の投稿に「死ね」「消えろ」と何度もコメントした。",
    answer: "out", law: "侮辱罪（刑法231条）など",
    body: "人前で（SNSも含む）人をばかにしたりけなしたりすると侮辱罪になりえます。2022年7月から厳しくなり、1年以下の拘禁刑もしくは30万円以下の罰金または拘留もしくは科料です。内容しだいで脅迫罪や名誉毀損罪にもなりえます。" },
  { level: "easy", emoji: "🐈", text: "飼っていた猫を飼えなくなったので、遠くの公園に置いてきた。",
    answer: "out", law: "動物愛護管理法44条3項",
    body: "愛護動物を捨てると、1年以下の拘禁刑または100万円以下の罰金です。飼えなくなったときは、新しい飼い主を探す、動物保護団体に相談するなど、捨てずに済む方法をとりましょう。" },
  { level: "easy", emoji: "🐾", text: "公園にいる野良猫がかわいそうだったので、キャットフードをあげた。",

async function createFx(canvas) {
  const THREE = await import("three");
  const { EffectComposer } = await import("three/addons/postprocessing/EffectComposer.js");
  const { RenderPass } = await import("three/addons/postprocessing/RenderPass.js");
  const { UnrealBloomPass } = await import("three/addons/postprocessing/UnrealBloomPass.js");
  const { OutputPass } = await import("three/addons/postprocessing/OutputPass.js");
  const { RoundedBoxGeometry } = await import("three/addons/geometries/RoundedBoxGeometry.js");
  const { FontLoader } = await import("three/addons/loaders/FontLoader.js");
  const { TextGeometry } = await import("three/addons/geometries/TextGeometry.js");

  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const OUT = new THREE.Color("#ff3355");
  const SAFE = new THREE.Color("#2f8bff");
  const GOLD = new THREE.Color("#ffcc33");

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  const scene = new THREE.Scene();
  scene.background = new THREE.Color("#0b0d17");
  scene.fog = new THREE.Fog("#0b0d17", 14, 34);
  const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
  camera.position.set(0, 0, 12);

  scene.add(new THREE.AmbientLight(0xffffff, 0.5));
  const key = new THREE.DirectionalLight(0xffffff, 2.2);
  key.position.set(4, 6, 8);
  scene.add(key);
  const rim = new THREE.PointLight(0x88aaff, 40, 30);
  rim.position.set(-6, -3, 4);
  scene.add(rim);

  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 1.0, 0.55, 0.2);
  composer.addPass(bloom);
  composer.addPass(new OutputPass());

  // ○ と × の形
  const circleGeo = new THREE.TorusGeometry(2.1, 0.5, 40, 140);
  const barGeo = new RoundedBoxGeometry(5.6, 1.0, 1.0, 5, 0.42);
  const material = (color, glow = 0.8) => new THREE.MeshStandardMaterial({
    color, emissive: color, emissiveIntensity: glow, metalness: 0.25, roughness: 0.3, transparent: true,
  });
  function makeSymbol(kind, glow) {
    if (kind === "out") return new THREE.Mesh(circleGeo, material(OUT, glow));
    const group = new THREE.Group();
    const mat = material(SAFE, glow);
    for (const angle of [Math.PI / 4, -Math.PI / 4]) {
      const bar = new THREE.Mesh(barGeo, mat);
      bar.rotation.z = angle;
      group.add(bar);
    }
    return group;
  }
  // 正解の発表に使う「OUT」「SAFE」の立体文字（フォントが読めなければ ○ × で代用）
  const wordGeo = {};
  try {
    const font = await new FontLoader().loadAsync("https://cdn.jsdelivr.net/npm/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json");
    for (const [kind, word] of [["out", "OUT"], ["safe", "SAFE"]]) {
      const geo = new TextGeometry(word, {
        font, size: 1.5, height: 0.55, curveSegments: 6,
        bevelEnabled: true, bevelThickness: 0.12, bevelSize: 0.06, bevelSegments: 3,
      });
      geo.center();
      wordGeo[kind] = geo;
    }
  } catch (error) {
    console.warn("フォントを読み込めなかったので ○ × で代用します", error);
  }
  function makeWord(kind, glow) {
    if (!wordGeo[kind]) return makeSymbol(kind, glow);
    return new THREE.Mesh(wordGeo[kind], material(kind === "out" ? OUT : SAFE, glow));
  }
  const setOpacity = (object, value) => object.traverse((o) => { if (o.material) o.material.opacity = value; });

  // 背景に漂う小さな ○ と ×
  const drifters = [];
  for (let i = 0; i < (reduced ? 14 : 34); i++) {
    const kind = i % 2 ? "out" : "safe";
    const mesh = makeSymbol(kind, 0.35);
    const s = 0.12 + Math.random() * 0.22;
    mesh.scale.setScalar(s);
    mesh.position.set((Math.random() - 0.5) * 30, (Math.random() - 0.5) * 20, -4 - Math.random() * 18);
    mesh.rotation.set(Math.random() * 6, Math.random() * 6, Math.random() * 6);
    setOpacity(mesh, 0.55);
    mesh.userData = { spin: new THREE.Vector3((Math.random() - 0.5) * 0.6, (Math.random() - 0.5) * 0.6, (Math.random() - 0.5) * 0.3), rise: 0.15 + Math.random() * 0.35 };
    scene.add(mesh);
    drifters.push(mesh);
  }

  // 大きな記号（正解の発表）とタイトルの 2 つ
  let hero = null;           // { object, born, baseY, targetY, leaving, leftAt, wobble }
  let titlePair = [];

  const MAX_SPARKS = reduced ? 300 : 1400;
  const sparkPos = new Float32Array(MAX_SPARKS * 3);
  const sparkCol = new Float32Array(MAX_SPARKS * 3);
  const sparkVel = new Float32Array(MAX_SPARKS * 3);
  const sparkLife = new Float32Array(MAX_SPARKS);
  const sparkGeo = new THREE.BufferGeometry();
  sparkGeo.setAttribute("position", new THREE.BufferAttribute(sparkPos, 3));
  sparkGeo.setAttribute("color", new THREE.BufferAttribute(sparkCol, 3));
  const sparks = new THREE.Points(sparkGeo, new THREE.PointsMaterial({
    size: 0.16, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  }));
  scene.add(sparks);
  let sparkCursor = 0;
  function burst(center, colors, count, speed) {
    for (let n = 0; n < count; n++) {
      const i = sparkCursor;
      sparkCursor = (sparkCursor + 1) % MAX_SPARKS;
      const dir = new THREE.Vector3().randomDirection().multiplyScalar(speed * (0.35 + Math.random()));
      sparkPos.set([center.x, center.y, center.z], i * 3);
      sparkVel.set([dir.x, dir.y, dir.z * 0.6], i * 3);
      const c = colors[n % colors.length];
      const boost = 0.7 + Math.random() * 0.8;
      sparkCol.set([c.r * boost, c.g * boost, c.b * boost], i * 3);
      sparkLife[i] = 1;
    }
  }

  // 紙吹雪
  const CONFETTI = reduced ? 0 : 220;
  const confetti = new THREE.InstancedMesh(
    new THREE.PlaneGeometry(0.16, 0.28),
    new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }),
    Math.max(CONFETTI, 1));
  confetti.count = 0;
  const confettiState = [];
  const palette = ["#ff3355", "#2f8bff", "#ffcc33", "#39e6a0", "#ffffff", "#b06bff"].map((c) => new THREE.Color(c));
  for (let i = 0; i < CONFETTI; i++) confetti.setColorAt(i, palette[i % palette.length]);
  scene.add(confetti);
  const dummy = new THREE.Object3D();
  function launchConfetti() {
    confettiState.length = 0;
    for (let i = 0; i < CONFETTI; i++) {
      confettiState.push({
        p: new THREE.Vector3((Math.random() - 0.5) * 4, -1 + Math.random() * 2, 1 + Math.random() * 2),
        v: new THREE.Vector3((Math.random() - 0.5) * 12, 6 + Math.random() * 9, (Math.random() - 0.5) * 4),
        r: new THREE.Euler(Math.random() * 6, Math.random() * 6, Math.random() * 6),
        s: new THREE.Vector3((Math.random() - 0.5) * 14, (Math.random() - 0.5) * 14, (Math.random() - 0.5) * 14),
      });
    }
    confetti.count = CONFETTI;
    confetti.instanceColor && (confetti.instanceColor.needsUpdate = true);
  }

  // 衝撃波のリング
  const rings = [];
  function shockwave(color, delay = 0) {
    const ring = new THREE.Mesh(new THREE.RingGeometry(0.92, 1, 96), new THREE.MeshBasicMaterial({
      color, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
    }));
    ring.visible = false;
    ring.userData.start = clock.elapsedTime + delay;
    scene.add(ring);
    rings.push(ring);
  }

  // 画面の揺れ
  let shakeUntil = 0;
  let shakePower = 0;

  const clock = new THREE.Clock();
  const easeOutBack = (t) => { const c = 2.2; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
  const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);

  function removeHero(immediate = false) {
    if (!hero) return;
    if (immediate) { scene.remove(hero.object); hero = null; return; }
    hero.leaving = true;
    hero.leftAt = clock.elapsedTime;
  }

  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false);
    composer.setSize(w, h);
    bloom.setSize(w, h);
    camera.aspect = w / h;
    // 縦長の画面では記号がはみ出さないよう少し引く
    camera.position.z = w / h < 0.7 ? 15 : 12;
    camera.updateProjectionMatrix();
  }
  addEventListener("resize", resize);
  resize();

  function tick() {
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;

    for (const d of drifters) {
      d.rotation.x += d.userData.spin.x * dt;
      d.rotation.y += d.userData.spin.y * dt;
      d.rotation.z += d.userData.spin.z * dt;
      d.position.y += d.userData.rise * dt;
      if (d.position.y > 11) d.position.y = -11;
    }

    for (const [i, m] of titlePair.entries()) {
      m.rotation.y = Math.sin(t * 0.8 + i * 1.6) * 0.6;
      m.rotation.x = Math.sin(t * 0.6 + i) * 0.2;
      m.position.y = 3.3 + Math.sin(t * 1.2 + i * 2) * 0.15;
    }

    if (hero) {
      const age = t - hero.born;
      const o = hero.object;
      if (hero.leaving) {
        const k = Math.min((t - hero.leftAt) / 0.3, 1);
        o.scale.setScalar(Math.max(1 - easeOutCubic(k), 0.001));
        o.rotation.z += dt * 8;
        if (k >= 1) { scene.remove(o); hero = null; }
      } else {
        const k = Math.min(age / 0.7, 1);
        const s = easeOutBack(k);
        o.scale.setScalar(Math.max(s, 0.001));
        o.position.z = -8 * (1 - easeOutCubic(k)) + 1;
        const spin = (1 - easeOutCubic(k)) * Math.PI * 4;
        o.rotation.y = spin + (k >= 1 ? Math.sin(age * 1.5) * 0.35 : 0);
        o.rotation.x = k >= 1 ? Math.sin(age * 1.1) * 0.12 : 0;
        hero.baseY += (hero.targetY - hero.baseY) * Math.min(dt * 5, 1);
        o.position.y = hero.baseY + (k >= 1 ? Math.sin(age * 2) * 0.12 : 0);
        if (hero.wobble && age < 0.9) o.position.x = Math.sin(age * 60) * 0.25 * (1 - age / 0.9);
        const glow = 0.8 + Math.max(0, 1.6 - age * 2.5);
        o.traverse((m) => { if (m.material) m.material.emissiveIntensity = glow; });
      }
    }

    // 光の粒
    for (let i = 0; i < MAX_SPARKS; i++) {
      if (sparkLife[i] <= 0) continue;
      sparkLife[i] -= dt * 0.9;
      const j = i * 3;
      sparkVel[j + 1] -= 4.5 * dt;
      sparkVel[j] *= 0.985; sparkVel[j + 1] *= 0.985; sparkVel[j + 2] *= 0.985;
      sparkPos[j] += sparkVel[j] * dt;
      sparkPos[j + 1] += sparkVel[j + 1] * dt;
      sparkPos[j + 2] += sparkVel[j + 2] * dt;
      if (sparkLife[i] <= 0) { sparkPos[j + 1] = -999; }
      else { const f = 0.96; sparkCol[j] *= f; sparkCol[j + 1] *= f; sparkCol[j + 2] *= f; }
    }
    sparkGeo.attributes.position.needsUpdate = true;
    sparkGeo.attributes.color.needsUpdate = true;

    // 紙吹雪
    if (confetti.count > 0) {
      let alive = 0;
      confettiState.forEach((c, i) => {
        c.v.y -= 9 * dt;
        c.v.multiplyScalar(0.985);
        if (c.v.y < -2.2) c.v.y = -2.2;      // ひらひら落ちる
        c.p.addScaledVector(c.v, dt);
        c.r.x += c.s.x * dt; c.r.y += c.s.y * dt; c.r.z += c.s.z * dt;
        dummy.position.copy(c.p);
        dummy.rotation.copy(c.r);
        dummy.updateMatrix();
        confetti.setMatrixAt(i, dummy.matrix);
        if (c.p.y > -12) alive++;
      });
      confetti.instanceMatrix.needsUpdate = true;
      if (!alive) confetti.count = 0;
    }

    // 衝撃波
    for (let i = rings.length - 1; i >= 0; i--) {
      const ring = rings[i];
      const age = t - ring.userData.start;
      if (age < 0) continue;
      ring.visible = true;
      const k = age / 0.9;
      ring.scale.setScalar(1 + easeOutCubic(Math.min(k, 1)) * 9);
      ring.position.y = hero ? hero.object.position.y : 0;
      ring.material.opacity = Math.max(1 - k, 0);
      if (k >= 1) { scene.remove(ring); ring.geometry.dispose(); ring.material.dispose(); rings.splice(i, 1); }
    }

    // 揺れ
    if (t < shakeUntil) {
      const p = shakePower * ((shakeUntil - t) / 0.55);
      camera.position.x = (Math.random() - 0.5) * p;
      camera.position.y = (Math.random() - 0.5) * p;
    } else {
      camera.position.x *= 0.8;
      camera.position.y *= 0.8;
    }

    composer.render();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  return {
    /** タイトル画面の ○ と × */
    title(show) {
      titlePair.forEach((m) => scene.remove(m));
      titlePair = [];
      if (!show) return;
      removeHero(true);
      titlePair = ["out", "safe"].map((kind, i) => {
        const m = makeSymbol(kind, 0.9);
        m.scale.setScalar(0.55);
        m.position.set(i ? 2.1 : -2.1, 3.3, 0);
        scene.add(m);
        return m;
      });
    },
    /** 正解を「OUT」「SAFE」の立体文字で出す。correct = プレイヤーが当てたか */
    play(answer, correct) {
      removeHero(true);
      const object = makeWord(answer, 1.6);
      object.scale.setScalar(0.001);
      scene.add(object);
      hero = { object, born: clock.elapsedTime, baseY: 0.6, targetY: 0.6, leaving: false, wobble: !correct };
      const color = answer === "out" ? OUT : SAFE;
      const center = new THREE.Vector3(0, 0.6, 1);
      if (correct) {
        setTimeout(() => {
          burst(center, [GOLD, color, new THREE.Color("#ffffff")], reduced ? 120 : 700, 11);
          shockwave(GOLD);
          shockwave(color, 0.12);
          launchConfetti();
        }, 380);
      } else {
        setTimeout(() => {
          burst(center, [new THREE.Color("#ff2244"), new THREE.Color("#661122")], reduced ? 60 : 260, 6);
          shockwave(new THREE.Color("#ff2244"));
          if (!reduced) { shakeUntil = clock.elapsedTime + 0.55; shakePower = 0.9; }
        }, 380);
      }
    },
    /** 解説が出たら、記号を上に寄せる */
    lift() { if (hero) hero.targetY = innerHeight / innerWidth > 1.3 ? 3.6 : 2.6; },
    clear() { removeHero(); },
    /** 結果画面: 点数に応じてお祝い */
    finale(ratio) {
      removeHero(true);
      if (ratio < 0.6) return;
      const c = new THREE.Vector3(0, 2, 0);
      burst(c, [GOLD, OUT, SAFE, new THREE.Color("#ffffff")], reduced ? 150 : 1000, 13);
      shockwave(GOLD);
      launchConfetti();
    },
  };
}

// ─────────────────────────────────────────────
// 画面とゲームの進行
// ─────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const screens = { title: $("screen-title"), quiz: $("screen-quiz"), result: $("screen-result") };
const LABEL = { out: "OUT", safe: "SAFE" };

let game = null;   // { level, questions, index, score, history, answered }

function show(name) {
  for (const [key, el] of Object.entries(screens)) el.classList.toggle("active", key === name);
}

function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderLevels() {
  const box = $("levels");
  box.innerHTML = "";
  for (const level of LEVELS) {
    const best = store.get(bestKey(level.id));
    const button = document.createElement("button");
    button.className = "level";
    button.innerHTML = `<span class="badge">${level.badge}</span>
      <span><div class="name">${level.name}</div><div class="sub">${level.sub}</div></span>
      <span class="best">${best ? `ベスト ${best.score}/${best.total}` : ""}</span>`;
    button.addEventListener("click", () => start(level.id));
    box.appendChild(button);
  }
}

function goTitle() {
  game = null;
  renderLevels();
  show("title");
  fx.title(true);
}

function start(levelId) {
  const pool = levelId === "all" ? QUESTIONS : QUESTIONS.filter((q) => q.level === levelId);
  const questions = shuffle(pool).slice(0, QUIZ_LENGTH);
  game = { level: levelId, questions, index: 0, score: 0, history: [], answered: false };
  fx.title(false);
  $("hud-level").textContent = LEVELS.find((l) => l.id === levelId).name;
  show("quiz");
  renderQuestion();
}

function renderQuestion() {
  const q = game.questions[game.index];
  game.answered = false;
  $("q-emoji").textContent = q.emoji;
  $("q-text").textContent = q.text;
  $("hud-count").textContent = `${game.index + 1} / ${game.questions.length}`;
  $("hud-score").textContent = `${game.score} 点`;
  $("bar").style.width = `${(game.index / game.questions.length) * 100}%`;
  $("question").classList.remove("gone");
  $("explain").classList.remove("show");
  fx.clear();
}

function answer(choice) {
  if (!game || game.answered) return;
  game.answered = true;
  const q = game.questions[game.index];
  const correct = choice === q.answer;
  if (correct) game.score++;
  game.history.push({ q, choice, correct });

  $("question").classList.add("gone");
  $("hud-score").textContent = `${game.score} 点`;
  $("bar").style.width = `${((game.index + 1) / game.questions.length) * 100}%`;
  fx.play(q.answer, correct);
  if (!correct && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const flash = $("flash");
    flash.classList.remove("on");
    void flash.offsetWidth;
    setTimeout(() => flash.classList.add("on"), 380);
  }
  if (navigator.vibrate) navigator.vibrate(correct ? 30 : [60, 40, 60]);

  $("verdict").textContent = correct ? "正解！" : "ざんねん…";
  $("verdict").className = `verdict ${correct ? "ok" : "ng"}`;
  $("compare").innerHTML =
    `<span>あなた <b class="${choice}">${LABEL[choice]}</b></span>` +
    `<span>法律では <b class="${q.answer}">${LABEL[q.answer]}</b></span>`;
  $("law").textContent = q.law;
  $("body").textContent = q.body;
  $("next").textContent = game.index + 1 < game.questions.length ? "次へ" : "結果を見る";

  setTimeout(() => {
    if (!game || !game.answered) return;
    $("explain").classList.add("show");
    fx.lift();
    $("next").focus({ preventScroll: true });
  }, 1100);
}

function next() {
  if (!game || !game.answered) return;
  game.index++;
  if (game.index < game.questions.length) renderQuestion();
  else finish();
}

function finish() {
  const total = game.questions.length;
  const ratio = game.score / total;
  const rank = RANKS.find((r) => ratio >= r.min);
  const best = store.get(bestKey(game.level));
  if (!best || game.score / best.total < ratio) store.set(bestKey(game.level), { score: game.score, total });

  $("r-level").textContent = LEVELS.find((l) => l.id === game.level).name;
  $("r-points").innerHTML = `${game.score}<small> / ${total}</small>`;
  $("r-rank").textContent = rank.name;
  $("r-comment").textContent = rank.comment;
  const list = $("recap");
  list.innerHTML = "";
  for (const h of game.history) {
    const li = document.createElement("li");
    li.innerHTML = `<span class="res ${h.correct ? "ok" : "ng"}">${h.correct ? "◎" : "✕"}</span>
      <span class="q"></span><span class="ans ${h.q.answer}">${LABEL[h.q.answer]}</span>`;
    li.querySelector(".q").textContent = `${h.q.emoji} ${h.q.text}`;
    list.appendChild(li);
  }
  renderPromo();
  show("result");
  screens.result.scrollTop = 0;
  fx.finale(ratio);
}

document.querySelectorAll(".answer").forEach((b) => b.addEventListener("click", () => answer(b.dataset.answer)));
$("next").addEventListener("click", next);
$("retry").addEventListener("click", () => start(game.level));
$("back").addEventListener("click", goTitle);
$("promo-shuffle").addEventListener("click", renderPromo);
addEventListener("keydown", (e) => {
  if (!screens.quiz.classList.contains("active")) return;
  const k = e.key.toLowerCase();
  if (k === "o" || k === "1") answer("out");
  else if (k === "s" || k === "x" || k === "2") answer("safe");
  else if (k === "enter" && game?.answered && $("explain").classList.contains("show")) { e.preventDefault(); next(); }
});

goTitle();
</script>
